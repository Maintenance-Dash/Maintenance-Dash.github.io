      font-weight: 700;

    }

      background: linear-gradient(135deg, #ffda79, #ffb52e);

      transform: scale(0.97);
    }

    .arrow {
      font-size: 22px;
      transition: transform 0.3s ease;
    }

    .btn-monitoring:hover .arrow {
      transform: translateX(5px);
    }

    .footer {
      position: absolute;
      z-index: 1;
      bottom: 22px;
      left: 15px;
      right: 15px;
      text-align: center;
      color: rgba(255, 255, 255, 0.70);
      font-size: 12px;
      letter-spacing: 1px;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 600px) {

        letter-spacing: 2px;

        min-width: 220px;
        padding: 15px 22px;
        font-size: 14px;
      }

      .footer {
        font-size: 10px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>
